:root {

* { box-sizing: border-box; }

.flashcard { min-height:280px; background:var(--forest); color:#fffaf0; border-radius:22px; padding:29px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; box-shadow:0 18px 35px rgba(23,59,53,.15); position:relative; overflow:hidden; }
.flashcard:after { content:""; position:absolute; inset:15px; border:1px solid rgba(255,255,255,.11); border-radius:15px; pointer-events:none; }
.flashcard .flash-tag { color:#b4cbb8; font:800 9px Manrope; letter-spacing:.16em; text-transform:uppercase; }
.flashcard h2 { color:#fffaf0; font-size:37px; margin:20px 0 9px; }
.flashcard .flash-hint { color:#d1d9cf; font-size:10px; }
.flashcard .flash-answer { display:none; max-width:440px; color:#edf2e9; font-size:12px; line-height:1.8; margin-top:17px; }
.flashcard.revealed .flash-answer { display:block; }
.flashcard .tap-hint { color:#d5c59e; font-size:9px; margin-top:24px; }
.flash-controls { display:flex; justify-content:center; gap:9px; margin:15px 0; flex-wrap:wrap; }
.progress-line { height:5px; border-radius:8px; background:#e6e2d9; overflow:hidden; }
.progress-line span { display:block;height:100%;background:var(--sage);border-radius:8px; }
.quiz-builder { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start; }
.select-word { display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid #f0ece5; }
.select-word:last-child { border-bottom:0; }
.select-word input { accent-color:var(--forest); }
.select-word strong { font:700 11px Manrope; }
.select-word small { color:#8a8d84; font-size:9px; }
.quiz-question { padding:24px; }
.quiz-question h2 { font-size:20px; line-height:1.5; }
.quiz-choice { display:block; width:100%; padding:12px 13px; border:1px solid #e7e3d9; border-radius:9px; background:#fff; text-align:left; margin-top:8px; color:#4c564e; font-size:11px; }
.quiz-choice:hover { border-color:#a7c2a8; }
.quiz-choice.selected-correct { background:#edf5ed;border-color:#a3c8a7;color:#2d6943; }
.quiz-choice.selected-wrong { background:#fbefed;border-color:#dcb5b1;color:#994e48; }
.modal-backdrop { position:fixed;inset:0;background:rgba(16,32,26,.42);z-index:100;display:grid;place-items:center;padding:18px; }

.toast { position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#203f35;color:#fffaf0;padding:11px 16px;border-radius:9px;font-size:11px;box-shadow:0 12px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:150; }
.toast.show { opacity:1;transform:translate(-50%,0); }
.filter-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:15px; }
.filter-select { border:1px solid #e6e1d7; background:white; border-radius:8px; padding:9px 10px; color:#58645a; font-size:10px; }
.search-result-label { color:#8a8e83; font-size:10px; margin-bottom:12px; }

  function setView(view) {
    ui.view = view;
    ui.selectedWord = null;
    ui.selectedLetter = '';
    ui.dictionaryFilter = '';
    ui.pyqCategory = '';
    ui.pyqExamKey = '';
    ui.phraseFilter = '';
    ui.questionAnswers = {};

  function wordCard(word) {
    const saved = isSaved(word.id);
    const difficult = isDifficult(word.id);
    return `<article class="card word-card" data-action="open-word" data-id="${esc(word.id)}">
      <div class="word-card-top"><div><h3>${esc(word.word)}</h3><div class="word-meta">${esc(word.pos)} · ${esc(word.letter)}</div></div>
      <div class="word-card-actions"><button title="${saved ? 'Saved' : 'Save word'}" data-action="toggle-saved" data-id="${esc(word.id)}" onclick="event.stopPropagation()">${saved ? '◆' : '◇'}</button><button title="${difficult ? 'Marked difficult' : 'Mark difficult'}" data-action="toggle-difficult" data-id="${esc(word.id)}" onclick="event.stopPropagation()">${difficult ? '⚑' : '⚐'}</button></div></div>
      <p>${esc(word.banglaMeaning)}</p>
    </article>`;
  }

  function alphabetTiles(active = '') {
    return `<div class="letter-grid">${letters.map((letter) => {

    }).join('')}</div>`;
  }

  function renderDictionary() {

      <div class="page-head"><div><div class="eyebrow">AURA DICTIONARY</div><h1>Find your next word.</h1><p>Browse the vocabulary by its first letter, or search the starter collection. Choose a word to explore its English definition, Bangla meaning, synonyms, antonyms and examination history.</p></div><div class="inline-search"><input id="dictionaryFilter" type="search" value="${esc(ui.dictionaryFilter)}" placeholder="Filter this dictionary..."></div></div>

  function renderWordDetail(word) {
    if (!word) { setView('dictionary'); return; }
    addHistory('word', word.id, word.word);
    const appearances = exams.filter((exam) => exam.wordId === word.id);
    const learned = learnedInfo(word.id);
    root.innerHTML = `
      <div class="breadcrumb"><button data-action="go" data-view="dictionary">Aura Dictionary</button><span>›</span><span>${esc(word.letter)}</span><span>›</span><strong>${esc(word.word)}</strong></div>
      <div class="word-detail-head"><div><div class="eyebrow">WORD EXPLORER</div><div class="word-title"><h1>${esc(word.word)}</h1><span class="pill green">${esc(word.pos)}</span></div><div class="pron-line"><span>${esc(word.ipa || 'Pronunciation not provided')}</span><button class="sound-btn" data-action="speak" data-word="${esc(word.word)}">▶ Hear pronunciation</button><span class="muted">Browser voice preview</span></div></div>
        <div class="detail-actions"><button class="btn ${isSaved(word.id) ? 'btn-soft' : 'btn-secondary'}" data-action="toggle-saved" data-id="${esc(word.id)}">${isSaved(word.id) ? '◆ Saved' : '◇ Save to My Lexicon'}</button><button class="btn ${isDifficult(word.id) ? 'btn-danger-soft' : 'btn-secondary'}" data-action="toggle-difficult" data-id="${esc(word.id)}">${isDifficult(word.id) ? '⚑ Difficult' : '⚐ Mark as Difficult'}</button></div></div>
      <div class="detail-layout"><div>

        <section class="card definition-card"><h3><span class="definition-index">03</span> বাংলা অর্থ</h3><p class="meaning-emphasis">${esc(word.banglaMeaning)}</p></section>
        <section class="card definition-card"><h3><span class="definition-index">04</span> Synonyms <span class="pill green">Similar meaning</span></h3><div class="chip-list">${word.synonyms.length ? word.synonyms.map((item) => `<button class="chip syn" data-action="search-term" data-term="${esc(item)}">${esc(item)}</button>`).join('') : '<span class="muted">No synonyms added yet.</span>'}</div></section>
        <section class="card definition-card"><h3><span class="definition-index">05</span> Antonyms <span class="pill red">Opposite meaning</span></h3><div class="chip-list">${word.antonyms.length ? word.antonyms.map((item) => `<button class="chip ant" data-action="search-term" data-term="${esc(item)}">${esc(item)}</button>`).join('') : '<span class="muted">No antonyms added yet.</span>'}</div></section>
        ${word.example ? `<section class="card definition-card"><h3><span class="definition-index">06</span> Example in context</h3><p><em>${esc(word.example)}</em></p></section>` : ''}
        ${word.forms ? `<section class="card definition-card"><h3><span class="definition-index">07</span> Word forms</h3><p>${esc(word.forms)}</p></section>` : ''}
      </div><aside>
        <section class="card side-card"><h3>Where It Appeared <span class="pill gold">${appearances.length}</span></h3>${appearances.length ? appearances.map((exam) => `<div class="exam-mini" data-action="open-exam-group" data-key="${esc(groupKey(exam))}"><div class="exam-mini-icon">${esc(exam.category === 'Medical Admission' ? 'MD' : exam.category === 'BCS' ? 'BCS' : exam.category === 'GST Admission' ? 'GST' : 'UNI')}</div><div><strong>${esc(exam.exam)}</strong><small>${esc(exam.session)} · ${esc(exam.unit)} · ${esc(exam.kind)}</small></div></div>`).join('') : '<p>No examination appearance is included in the current starter dataset. This does not mean the word has never appeared in an examination.</p>'}<p class="small-note" style="margin-top:12px">Question records are provisional transcriptions until checked against original papers.</p></section>
        <section class="card side-card"><h3>Mark as Learned</h3><p>Choose when you want this word to return for revision. Recall will place it in your review queue.</p><div class="learning-control"><label for="learnInterval">Next revision</label><select id="learnInterval"><option value="1">1 day</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="28">28 days</option><option value="custom">Custom</option></select></div><div id="customIntervalWrap" style="display:none;margin-top:9px"><input id="customInterval" class="field" type="number" min="1" max="365" value="7" placeholder="Number of days"></div><button class="btn btn-primary" style="width:100%;margin-top:12px" data-action="mark-learned" data-id="${esc(word.id)}">${learned ? 'Update revision schedule' : '✓ Mark as Learned'}</button>${learned ? `<p class="small-note" style="margin-top:10px">Next review: ${dateLabel(learned.nextReview)} · Current interval: ${learned.intervalDays} days</p>` : ''}</section>

  function groupKey(exam) { return `${exam.category}||${exam.exam}||${exam.session}||${exam.unit}`; }
  function parseGroupKey(key) { return key.split('||'); }

  function renderPYQ() {
    if (ui.pyqExamKey) return renderPYQQuestions();
    if (ui.pyqCategory) return renderPYQGroups();
    const cards = categoryMeta.map((meta) => {
      const count = exams.filter((exam) => exam.category === meta.id).length;
      return `<button class="category-card" data-action="select-pyq-category" data-category="${esc(meta.id)}"><div class="category-symbol">${esc(meta.icon)}</div><h3>${esc(meta.title)}</h3><p>${esc(meta.description)}</p><span class="category-count">${count ? `${count} question records` : 'No records added yet'} ↗</span></button>`;
    }).join('');
    root.innerHTML = `<div class="page-head"><div><div class="eyebrow">AURA PYQ · PREVIOUS YEAR QUESTIONS</div><h1>Learn from what was asked.</h1><p>Explore word-related questions from Bangladesh's admission and competitive examinations. Choose an exam category, then select an examination session and unit.</p></div><span class="pill gold">${exams.length} starter records</span></div>
      <div class="notice"><strong>Dataset status:</strong> These are draft transcriptions from secondary question sources. Some option sets and answer keys require checking against original papers. The site marks these records so they are not mistaken for official verified copies.</div>
      <div class="section-row"><h2>Choose an examination category</h2><span class="card-kicker">EXAM LIBRARY</span></div><div class="category-grid">${cards}</div>
      <div class="section-row"><h2>How Aura PYQ is organised</h2></div><div class="grid grid-3"><div class="card card-pad"><div class="card-kicker">01 · CATEGORY</div><h3 style="margin-top:9px">Exam group</h3><p class="muted" style="font-size:10px;line-height:1.6;margin:0">BCS, medical, engineering, university, GST and other exams.</p></div><div class="card card-pad"><div class="card-kicker">02 · SESSION</div><h3 style="margin-top:9px">Year and unit</h3><p class="muted" style="font-size:10px;line-height:1.6;margin:0">Select a session such as 2025–26, then choose the relevant unit.</p></div><div class="card card-pad"><div class="card-kicker">03 · QUESTION</div><h3 style="margin-top:9px">Question and answer</h3><p class="muted" style="font-size:10px;line-height:1.6;margin:0">Read the prompt, check options, reveal the answer and source notes.</p></div></div>`;
  }

  function renderPYQGroups() {
    const category = ui.pyqCategory;
    const categoryInfo = categoryMeta.find((item) => item.id === category);
    const groups = [...new Map(exams.filter((exam) => exam.category === category).map((exam) => [groupKey(exam), exam])).values()];
    root.innerHTML = `<div class="breadcrumb"><button data-action="go" data-view="pyq">Aura PYQ</button><span>›</span><strong>${esc(categoryInfo ? categoryInfo.title : category)}</strong></div>
      <div class="page-head"><div><div class="eyebrow">AURA PYQ · EXAM CATEGORIES</div><h1>${esc(categoryInfo ? categoryInfo.title : category)}</h1><p>Choose an examination, session and unit to view the vocabulary-related questions available in this starter archive.</p></div><button class="btn btn-secondary" data-action="pyq-back">← All categories</button></div>
      ${groups.length ? `<div class="exam-grid">${groups.map((exam) => {
        const qCount = exams.filter((item) => groupKey(item) === groupKey(exam)).length;
        return `<article class="card exam-card" data-action="open-exam-group" data-key="${esc(groupKey(exam))}"><div class="exam-card-top"><span class="pill gold">${esc(exam.category)}</span><span class="pill">${esc(exam.unit)}</span></div><h3>${esc(exam.exam)}</h3><p>${esc(exam.session)} · ${esc(exam.unit)}</p><div class="exam-card-bottom"><span>${qCount} vocabulary-related ${qCount === 1 ? 'question' : 'questions'}</span><strong>Open session ↗</strong></div></article>`;
      }).join('')}</div>` : `<div class="empty-state"><div class="empty-symbol">＋</div><h3>No question records yet</h3><p>This examination category is ready for future records. Add a verified paper and its vocabulary-related questions when available.</p><button class="btn btn-secondary btn-small" data-action="pyq-back">Back to categories</button></div>`}`;
  }

  function renderPYQQuestions() {
    const [category, examName, session, unit] = parseGroupKey(ui.pyqExamKey);
    const selected = exams.filter((exam) => groupKey(exam) === ui.pyqExamKey);
    root.innerHTML = `<div class="breadcrumb"><button data-action="go" data-view="pyq">Aura PYQ</button><span>›</span><button data-action="select-pyq-category" data-category="${esc(category)}">${esc(category)}</button><span>›</span><strong>${esc(session)}</strong></div>
      <div class="page-head"><div><div class="eyebrow">${esc(category)} · ${esc(session)}</div><h1>${esc(examName)}</h1><p>${esc(unit)} · ${selected.length} word-related ${selected.length === 1 ? 'question' : 'questions'} in the current starter archive.</p></div><button class="btn btn-secondary" data-action="pyq-back">← Back</button></div>
      <div class="notice"><strong>Source and accuracy notice:</strong> This is a working archive prototype. Each item is labelled according to its current verification status. Draft options are not represented as official paper text. Disputed answers are highlighted.</div>
      ${selected.map(questionCard).join('')}`;
  }

  function questionCard(question) {
    const selectedOption = ui.questionAnswers[question.id];
    const hasAnswer = selectedOption !== undefined;
    const answerIsChecked = hasAnswer;
    const targetWord = question.wordId ? getWord(question.wordId) : null;
    const targetPhrase = question.phraseId ? getPhrase(question.phraseId) : null;
    const recordStatus = `<span class="pill ${statusClass(question.status)}">${esc(question.status)}</span>`;
    const optionHtml = question.options.length ? `<div class="options">${question.options.map((option, index) => {
      let extra = '';
      if (answerIsChecked && question.answer !== null && index === question.answer && question.status !== 'Answer disputed') extra = 'correct';
      else if (answerIsChecked && selectedOption === index && question.answer !== null && selectedOption !== question.answer) extra = 'wrong';
      return `<button class="option ${extra}" data-action="choose-question-option" data-id="${esc(question.id)}" data-index="${index}"><span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${esc(option)}</span></button>`;
    }).join('')}</div>` : `<div class="empty-options">Original answer options were not included in the imported source summary. They have intentionally not been invented.</div>`;
    const answerDisplay = answerIsChecked ? `<div class="answer-note show"><strong>Recorded answer:</strong> ${question.answer !== null ? `${String.fromCharCode(65 + question.answer)}. ` : ''}${esc(question.answerText || 'Not available')}. ${question.status === 'Answer disputed' ? '<br><strong>Warning:</strong> The published answer is disputed. Review the source note before using it.' : ''}<br>${esc(question.note || '')}</div>` : '';
    return `<article class="card question-card" data-id="${esc(question.id)}"><div class="question-top"><div class="question-top-left"><span class="question-id">${esc(question.id)}</span><span class="pill">${esc(question.kind)}</span>${recordStatus}</div><span class="card-kicker">${esc(question.session)}</span></div>
      <div class="question-prompt">${esc(question.prompt)}</div>${optionHtml}
      <div class="question-foot"><div>${targetWord ? `<button class="text-link" data-action="open-word" data-id="${esc(targetWord.id)}">Dictionary: ${esc(targetWord.word)} ↗</button>` : targetPhrase ? `<button class="text-link" data-action="open-phrase" data-id="${esc(targetPhrase.id)}">Phrase library: ${esc(targetPhrase.phrase)} ↗</button>` : ''}</div><button class="btn btn-secondary btn-small" data-action="reveal-question-answer" data-id="${esc(question.id)}">${answerIsChecked ? 'Answer shown' : 'Check answer'}</button></div>
      ${answerDisplay}<div class="small-note" style="margin-top:10px">Source: <a href="${esc(question.source)}" target="_blank" rel="noopener">Open reference ↗</a></div></article>`;
  }

  function renderPhrases() {
    const query = ui.phraseFilter.toLowerCase();
    const items = phrases.filter((phrase) => `${phrase.phrase} ${phrase.meaning} ${phrase.bangla}`.toLowerCase().includes(query));
    root.innerHTML = `<div class="page-head"><div><div class="eyebrow">AURA LANGUAGE LIBRARY</div><h1>Idioms & Phrases</h1><p>A dedicated space for idioms, phrasal verbs and expressions. These are kept separate from the A–Z word dictionary, while their examination appearances remain linked to Aura PYQ.</p></div><div class="inline-search"><input id="phraseFilter" type="search" value="${esc(ui.phraseFilter)}" placeholder="Search an idiom or phrase..."></div></div>
      <div class="notice"><strong>Separate library:</strong> Phrases and idioms do not appear as individual entries in the Aura Dictionary. When an expression has an examination record, its question can still be opened from Aura PYQ.</div>
      <div class="phrase-grid">${items.map((phrase) => `<article class="card phrase-card"><div class="word-card-top"><span class="pill gold">${esc(phrase.type)}</span><span class="card-kicker">PHRASE LIBRARY</span></div><h3>${esc(phrase.phrase)}</h3><p>${esc(phrase.meaning)}</p><p class="bn-phrase">${esc(phrase.bangla)}</p><div class="phrase-example">“${esc(phrase.example)}”</div><div style="margin-top:13px">${phrase.relatedExamIds.length ? phrase.relatedExamIds.map((id) => `<button class="text-link" data-action="open-question" data-id="${esc(id)}">View examination question ↗</button>`).join(' ') : '<span class="small-note">No linked examination record.</span>'}</div></article>`).join('')}</div>
      ${items.length ? '' : `<div class="empty-state"><h3>No matching phrases</h3><p>Try a different search term.</p></div>`}`;
  }

  function dueItems() {
    return Object.entries(userState.learned).filter(([, item]) => item.nextReview <= todayISO()).map(([id, item]) => ({ word:getWord(id), info:item })).filter((entry) => entry.word).sort((a,b) => a.info.nextReview.localeCompare(b.info.nextReview));
  }
  function renderRecall() {
    const due = dueItems();
    const upcoming = Object.entries(userState.learned).filter(([, item]) => item.nextReview > todayISO()).map(([id, item]) => ({ word:getWord(id), info:item })).filter((entry) => entry.word).sort((a,b) => a.info.nextReview.localeCompare(b.info.nextReview));

  function openWord(id) {

  function toggleArrayValue(arrayName, id, label) {

    else { array.unshift(id); toast(`${label} added.`); }

  function scheduleLearned(id, intervalDays) {
    const days = Math.max(1, Math.min(365, Number(intervalDays) || 7));
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + days);
    userState.learned[id] = { learnedAt:todayISO(), intervalDays:days, nextReview:next.toISOString().slice(0,10), reviews:(userState.learned[id]?.reviews || 0) + 1 };
    persist(); toast(`${getWord(id)?.word || 'Word'} scheduled for ${dateLabel(userState.learned[id].nextReview)}.`); render();
  }
  function selectedInterval(selectId, customId) {
    const select = document.getElementById(selectId);
    if (!select) return 7;
    if (select.value === 'custom') return Number(document.getElementById(customId)?.value || 7);
    return Number(select.value);

  function startRecall(ids) {

  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    const id = button.dataset.id;
    if (action === 'go') { setView(button.dataset.view); return; }

    if (action === 'search-term') { const term=button.dataset.term; const word=words.find((item)=>item.word.toLowerCase()===term.toLowerCase()); if (word) openWord(word.id); else { globalSearch.value=term; toast(`“${term}” is not in the starter word list yet.`); } return; }
    if (action === 'speak') { const text=button.dataset.word; if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(text); utterance.lang='en-US'; window.speechSynthesis.speak(utterance); } else toast('Pronunciation playback is not supported by this browser.'); return; }
    if (action === 'mark-learned') { const interval=selectedInterval('learnInterval','customInterval'); scheduleLearned(id,interval); return; }

  document.addEventListener('input', (event) => {

  function updateSuggestions(value) {
    const query=value.trim().toLowerCase();
    if (!query) { suggestions.classList.remove('open'); suggestions.innerHTML=''; return; }
    const matches=[...words.filter((word)=>word.word.toLowerCase().includes(query)).map((word)=>({type:'word',id:word.id,label:word.word,sub:word.banglaMeaning})),...phrases.filter((phrase)=>phrase.phrase.toLowerCase().includes(query)).map((phrase)=>({type:'phrase',id:phrase.id,label:phrase.phrase,sub:'Idioms & Phrases'}))].slice(0,7);
    suggestions.innerHTML=matches.length?matches.map((match)=>`<button class="suggestion" data-action="${match.type==='word'?'open-word':'open-phrase'}" data-id="${esc(match.id)}"><strong>${esc(match.label)}</strong><small>${esc(match.sub)}</small></button>`).join(''):`<div class="suggestion"><span>No matching starter word</span><small>Try another term</small></div>`;
    suggestions.classList.add('open');
  }
  function searchTerm(value) {
    const query=String(value||'').trim().toLowerCase();
    if (!query) { toast('Type a word to search.'); return; }
    const word=words.find((item)=>item.word.toLowerCase()===query);
    if (word) { globalSearch.value='';suggestions.classList.remove('open');openWord(word.id);return; }
    const phrase=phrases.find((item)=>item.phrase.toLowerCase()===query);
    if (phrase) { globalSearch.value='';suggestions.classList.remove('open');openPhrase(phrase.id);return; }
    ui.view='dictionary';ui.selectedWord=null;ui.selectedLetter='';ui.dictionaryFilter=query;globalSearch.value='';suggestions.classList.remove('open');document.querySelectorAll('.nav-item').forEach((item)=>item.classList.toggle('active',item.dataset.view==='dictionary'));document.getElementById('topbarPage').textContent='Aura Dictionary';renderDictionary();
  }

  document.querySelectorAll('.nav-item').forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
